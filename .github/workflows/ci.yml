name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The test job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so the routing-eval test can compare floor.json with the base branch.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite
        run: npm test

      - name: Validate npm pack dry-run
        run: npm pack --dry-run
